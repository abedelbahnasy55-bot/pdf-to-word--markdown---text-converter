    <title>استوديو التحرير والوثائق | محوّل PDF و Word الاحترافي</title>
    <meta name="description" content="منصة احترافية لتحويل وتفريغ ملفات PDF والصور والمستندات العربية والإنجليزية إلى Word (.docx) و Markdown بدقة معيارية مع معالجة خلفية مستمرة وتدقيق لغوي وقرآني متكامل." />
    <meta property="og:title" content="استوديو التحرير والوثائق | محوّل PDF و Word الاحترافي" />
    <meta property="og:description" content="منصة احترافية لتحويل وتفريغ ملفات PDF والصور والمستندات العربية والإنجليزية إلى Word (.docx) و Markdown بدقة معيارية." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <script>
      (function() {
        try {
          var savedTheme = window.localStorage.getItem('studio_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function() { /* Safe no-op */ },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}
      })();
    </script>
